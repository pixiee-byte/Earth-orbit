<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dots</title>
</head>
<body style="margin:0;background:#222">
<canvas id="c" width="300" height="300" style="background:black"></canvas>
<script>
const ctx = document.getElementById("c").getContext("2d");
let angle = 0;

function draw() {
  ctx.clearRect(0, 0, 300, 300);

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(150, 150, 5, 0, Math.PI * 2);
  ctx.fill();

  let x = 150 + Math.cos(angle) * 80;
  let y = 150 + Math.sin(angle) * 80;
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fill();

  angle += 0.03;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
